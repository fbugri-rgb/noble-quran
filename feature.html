<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Play feature graphic source</title>
<!--
  The source for img/og.jpg. Chrome writes PNG, so render at 2x and convert:

    chrome --headless --window-size=1200,630 --force-device-scale-factor=2 \
           --screenshot=og_raw.png http://localhost:8000/og.html
    # downscale og_raw.png to 1200x630 and save as img/og.jpg

  Written as a page rather than drawn in a script so the card uses the site's
  own typefaces and palette instead of an approximation of them.
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Alegreya+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --ox-deep:#150208; --ox:#23050d;
    --gold:#d8ab53; --gold-bright:#f2dda4; --gold-dim:#8f7134;
    --ink:#f4e9d8; --body:#c3ab91;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{width:1024px;height:500px;overflow:hidden}
  body{
    background:var(--ox-deep);
    font-family:'Alegreya Sans',system-ui,sans-serif;
    color:var(--ink);
    position:relative;
    display:flex;align-items:center;
  }
  /* The same light the cover sits in on the page itself. */
  body::before{
    content:"";position:absolute;right:-8%;top:50%;transform:translateY(-50%);
    width:820px;height:820px;border-radius:50%;
    background:radial-gradient(closest-side,rgba(216,171,83,.22),transparent 70%);
  }
  .frame{position:absolute;inset:20px;border:1px solid rgba(216,171,83,.34);border-radius:6px;
    pointer-events:none}
  .frame::before,.frame::after{content:"";position:absolute;left:34px;right:34px;height:1px;
    background:linear-gradient(90deg,transparent,var(--gold) 50%,transparent);opacity:.5}
  .frame::before{top:-1px}
  .frame::after{bottom:-1px}

  .copy{position:relative;z-index:2;padding:0 0 0 64px;width:560px}
  .mark{display:flex;align-items:center;gap:13px;margin-bottom:24px}
  .mark img{width:46px;height:46px;border-radius:11px;box-shadow:0 4px 18px rgba(0,0,0,.5)}
  .mark span{font-family:'Amiri',Georgia,serif;font-size:25px;letter-spacing:.01em;color:var(--ink)}
  h1{font-family:'Amiri',Georgia,serif;font-weight:400;font-size:48px;line-height:1.08;
    color:#fffaf0;margin-bottom:22px}
  p{font-size:18px;line-height:1.45;color:var(--body);max-width:26ch}

  .stage{position:absolute;right:74px;top:50%;transform:translateY(-50%) rotate(-6deg);z-index:2}
  .phone{width:210px;aspect-ratio:1206/2622;border-radius:36px;padding:6px;
    background:linear-gradient(155deg,#4a4a52,#131316 28%,#0a0a0c 62%,#3a3a42);
    box-shadow:0 34px 70px rgba(0,0,0,.78),0 0 0 1px rgba(255,255,255,.06)}
  .screen{width:100%;height:100%;border-radius:30px;overflow:hidden;background:#000}
  .screen img{width:100%;height:100%;object-fit:cover;object-position:top;display:block}
  .island{position:absolute;top:16px;left:50%;transform:translateX(-50%);width:30%;height:24px;
    background:#000;border-radius:999px}
</style>
</head>
<body>
  <div class="frame"></div>

  <div class="copy">
    <div class="mark"><img src="img/icon.png" alt=""><span>The Noble Quran</span></div>
    <h1>Set the way a manuscript is set.</h1>
    <p>Tajweed coloured into the letters, and a cover worked by reading.</p>
  </div>

  <div class="stage">
    <div class="phone">
      <div class="island"></div>
      <div class="screen"><img src="img/cover_gold.webp" alt=""></div>
    </div>
  </div>
</body>
</html>
